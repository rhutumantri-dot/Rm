<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Nifty 50 — Company Dashboards</title>
<style>
  :root {
    color-scheme: light;
    --bg:#f4f5fb; --surface-1:#ffffff; --surface-2:#eef0f8; --surface-3:#f7f8fd; --border:#e4e6f1;
    --text-primary:#0d0f18; --text-secondary:#4a4f64; --text-muted:#888ea4;
    --accent:#5b4be0; --accent2:#2f7ef0;
    --series-1:#2a78d6; --series-2:#008300; --series-3:#e87ba4; --series-4:#eda100;
    --series-5:#1baf7a; --series-6:#eb6834; --series-7:#4a3aa7; --series-8:#e34948;
    --grid:#e9ebf4; --good:#0ca30c; --critical:#d03b3b;
    --glow: radial-gradient(58% 55% at 78% 32%, rgba(91,75,224,.16), transparent 70%);
    --shadow:0 1px 2px rgba(20,22,50,.05), 0 10px 30px rgba(20,22,50,.06);
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) {
      color-scheme: dark;
      --bg:#07080e; --surface-1:#12141e; --surface-2:#191c29; --surface-3:#0e1019; --border:#252a3b;
      --text-primary:#f4f6fc; --text-secondary:#b4b9cc; --text-muted:#767c93;
      --accent:#8b7bff; --accent2:#4d9bff;
      --series-1:#3987e5; --series-2:#008300; --series-3:#d55181; --series-4:#c98500;
      --series-5:#199e70; --series-6:#d95926; --series-7:#9085e9; --series-8:#e66767;
      --grid:#232736; --good:#34c034; --critical:#e35b5b;
      --glow: radial-gradient(58% 55% at 78% 28%, rgba(120,90,255,.24), transparent 70%);
      --shadow:0 1px 2px rgba(0,0,0,.5), 0 14px 36px rgba(0,0,0,.45);
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg:#07080e; --surface-1:#12141e; --surface-2:#191c29; --surface-3:#0e1019; --border:#252a3b;
    --text-primary:#f4f6fc; --text-secondary:#b4b9cc; --text-muted:#767c93;
    --accent:#8b7bff; --accent2:#4d9bff;
    --series-1:#3987e5; --series-2:#008300; --series-3:#d55181; --series-4:#c98500;
    --series-5:#199e70; --series-6:#d95926; --series-7:#9085e9; --series-8:#e66767;
    --grid:#232736; --good:#34c034; --critical:#e35b5b;
    --glow: radial-gradient(58% 55% at 78% 28%, rgba(120,90,255,.24), transparent 70%);
    --shadow:0 1px 2px rgba(0,0,0,.5), 0 14px 36px rgba(0,0,0,.45);
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: var(--bg); color: var(--text-primary);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased; }
  a { color: inherit; text-decoration: none; }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 24px 20px 64px; }

  header.top { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 8px;
    padding: 12px 0; position: sticky; top: 0; z-index: 20; background: color-mix(in srgb, var(--bg) 86%, transparent); backdrop-filter: blur(10px); }
  .brand { display: flex; align-items: center; gap: 11px; cursor: pointer; }
  .brand-mark { width: 38px; height: 38px; border-radius: 11px; flex: none;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    display: grid; place-items: center; color: #fff; font-weight: 800; font-size: 17px; box-shadow: 0 4px 14px rgba(90,75,224,.35); }
  .brand h1 { font-size: 17px; margin: 0; letter-spacing: -.2px; }
  .brand p { margin: 0; font-size: 12px; color: var(--text-muted); }
  .nav { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; }
  .nav .navlink { font-size: 13.5px; font-weight: 600; color: var(--text-secondary); padding: 7px 12px; border-radius: 8px; cursor: pointer; }
  .nav .navlink:hover { color: var(--text-primary); background: var(--surface-2); }
  .toggle { border: 1px solid var(--border); background: var(--surface-1); color: var(--text-secondary);
    border-radius: 999px; padding: 8px 13px; font-size: 13px; cursor: pointer; font-weight: 600; margin-left: 4px; }
  .toggle:hover { color: var(--text-primary); }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: none; cursor: pointer;
    font-size: 14px; font-weight: 700; padding: 12px 22px; border-radius: 12px; font-family: inherit; }
  .btn-primary { background: linear-gradient(135deg, var(--accent), var(--accent2)); color: #fff; box-shadow: 0 6px 20px rgba(90,75,224,.34); }
  .btn-primary:hover { filter: brightness(1.07); }
  .btn-ghost { background: var(--surface-2); color: var(--text-primary); border: 1px solid var(--border); }
  .btn-ghost:hover { border-color: var(--accent); }

  .backlink { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--text-secondary);
    font-weight: 600; margin-bottom: 14px; cursor: pointer; }
  .backlink:hover { color: var(--text-primary); }

  /* ---------- LANDING (home) ---------- */
  .section-title { font-size: 13px; text-transform: uppercase; letter-spacing: .6px; color: var(--text-muted); margin: 6px 2px 14px; font-weight: 700; }
  .row-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 44px 2px 18px; }
  .row-head h2 { font-size: 21px; margin: 0; letter-spacing: -.4px; }
  .row-head a { font-size: 13px; font-weight: 600; color: var(--accent); cursor: pointer; }
  .chg-up { color: var(--good); font-weight: 700; } .chg-down { color: var(--critical); font-weight: 700; }

  .hero-land { position: relative; display: grid; grid-template-columns: 1.05fr .95fr; gap: 30px; align-items: center; padding: 34px 0 40px; }
  .hero-land::before { content:''; position:absolute; inset:-60px -120px auto -120px; height:560px; background: var(--glow); pointer-events:none; z-index:0; }
  .hero-land > * { position: relative; z-index: 1; }
  @media (max-width: 860px) { .hero-land { grid-template-columns: 1fr; } }
  .eyebrow { display: inline-flex; align-items: center; gap: 7px; font-size: 12.5px; font-weight: 600; color: var(--accent);
    background: color-mix(in srgb, var(--accent) 12%, transparent); border: 1px solid color-mix(in srgb, var(--accent) 30%, transparent);
    padding: 6px 13px; border-radius: 999px; margin-bottom: 20px; }
  .hero-land h1 { font-size: 52px; line-height: 1.04; letter-spacing: -1.6px; margin: 0 0 18px; font-weight: 800; text-wrap: balance; }
  .hero-land h1 .grad { background: linear-gradient(100deg, var(--accent), var(--accent2)); -webkit-background-clip: text; background-clip: text; color: transparent; }
  @media (max-width: 560px) { .hero-land h1 { font-size: 38px; } }
  .hero-sub { font-size: 16.5px; color: var(--text-secondary); max-width: 44ch; margin: 0 0 26px; line-height: 1.55; }
  .hero-cta { display: flex; gap: 12px; flex-wrap: wrap; }

  .hero-visual { position: relative; min-height: 360px; }
  .fcard { position: absolute; background: color-mix(in srgb, var(--surface-1) 80%, transparent); backdrop-filter: blur(9px);
    border: 1px solid var(--border); border-radius: 16px; padding: 15px 17px; box-shadow: var(--shadow); }
  .fcard .fc-t { font-size: 12px; color: var(--text-muted); }
  .fcard .fc-v { font-size: 22px; font-weight: 800; letter-spacing: -.5px; margin: 2px 0; font-variant-numeric: tabular-nums; }
  .fc-rev { top: 0; right: 2%; width: 252px; }
  .fc-roce { top: 188px; left: 0; width: 196px; }
  .fc-np { top: 156px; right: 4%; width: 196px; }
  @media (max-width: 860px) { .hero-visual { min-height: 320px; margin-top: 10px; } }
  @media (max-width: 420px) { .fc-rev { right: 0; width: 220px; } .fc-np { right: 0; } }

  .feat-scroll { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(228px, 1fr); gap: 16px; overflow-x: auto; padding: 4px 2px 14px; scroll-snap-type: x mandatory; }
  .feat-scroll::-webkit-scrollbar { height: 8px; } .feat-scroll::-webkit-scrollbar-thumb { background: var(--border); border-radius: 8px; }
  .fco { scroll-snap-align: start; background: var(--surface-1); border: 1px solid var(--border); border-radius: 16px; padding: 18px; box-shadow: var(--shadow);
    cursor: pointer; transition: transform .12s, border-color .12s; display: flex; flex-direction: column; }
  .fco:hover { transform: translateY(-3px); border-color: var(--accent); }
  .fco .logo { width: 44px; height: 44px; border-radius: 13px; display: grid; place-items: center; color: #fff; font-weight: 800; font-size: 18px; margin: 0 auto 12px; }
  .fco .fco-name { text-align: center; font-weight: 700; font-size: 14.5px; }
  .fco .fco-price { text-align: center; font-size: 20px; font-weight: 800; margin-top: 6px; font-variant-numeric: tabular-nums; }
  .fco .fco-chg { text-align: center; font-size: 12.5px; font-weight: 700; margin-top: 2px; }
  .fco .fco-stats { margin-top: 14px; border-top: 1px solid var(--border); padding-top: 12px; display: flex; flex-direction: column; gap: 7px; }
  .fco .fco-stats .r { display: flex; justify-content: space-between; font-size: 12.5px; }
  .fco .fco-stats .r span { color: var(--text-muted); } .fco .fco-stats .r b { font-variant-numeric: tabular-nums; }
  .fco.soon { cursor: default; opacity: .5; } .fco.soon:hover { transform: none; border-color: var(--border); }

  .sector-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(178px, 1fr)); gap: 14px; }
  .sector { position: relative; overflow: hidden; border: 1px solid var(--border); border-radius: 16px; padding: 16px; cursor: pointer;
    min-height: 116px; display: flex; flex-direction: column; gap: 10px; transition: transform .12s, border-color .12s; }
  .sector:hover { transform: translateY(-2px); border-color: var(--accent); }
  .sector .sicon { width: 38px; height: 38px; border-radius: 10px; display: grid; place-items: center; font-size: 18px; }
  .sector .sname { font-weight: 700; font-size: 14.5px; margin-top: auto; }
  .sector .scount { font-size: 12px; color: var(--text-muted); }

  .compare { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  @media (max-width: 700px) { .compare { grid-template-columns: 1fr; } }
  .comp { border: 1px solid var(--border); border-radius: 16px; padding: 20px 22px; background: var(--surface-1); }
  .comp.good { border-color: color-mix(in srgb, var(--accent) 45%, var(--border)); background: color-mix(in srgb, var(--accent) 6%, var(--surface-1)); }
  .comp h4 { margin: 0 0 12px; font-size: 15px; } .comp.good h4 { color: var(--accent); }
  .comp .li { display: flex; align-items: center; gap: 10px; font-size: 14px; padding: 7px 0; color: var(--text-secondary); }
  .comp .li .ic { width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; font-size: 11px; font-weight: 800; flex: none; color:#fff; }

  .controls { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 14px; }
  .search { flex: 1; min-width: 220px; border: 1px solid var(--border); background: var(--surface-1); color: var(--text-primary);
    border-radius: 11px; padding: 11px 15px; font-size: 14px; }
  .search::placeholder { color: var(--text-muted); }
  .secfilter { display: flex; gap: 6px; flex-wrap: wrap; }
  .secbtn { border: 1px solid var(--border); background: var(--surface-1); color: var(--text-secondary);
    border-radius: 999px; padding: 6px 12px; font-size: 12.5px; font-weight: 600; cursor: pointer; }
  .secbtn[aria-pressed="true"] { background: linear-gradient(135deg,var(--accent),var(--accent2)); color: #fff; border-color: transparent; }

  .nifty-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(212px, 1fr)); gap: 12px; }
  .ncard { background: var(--surface-1); border: 1px solid var(--border); border-radius: 14px; padding: 14px 15px; box-shadow: var(--shadow);
    display: flex; flex-direction: column; gap: 3px; min-height: 96px; transition: transform .12s, border-color .12s; }
  .ncard.loaded { cursor: pointer; }
  .ncard.loaded:hover { border-color: var(--accent); transform: translateY(-2px); }
  .ncard.muted { opacity: .5; }
  .ncard .nsym { font-weight: 800; font-size: 14px; letter-spacing: .3px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .ncard .nname { font-size: 12.5px; color: var(--text-secondary); line-height: 1.3; }
  .ncard .nsec { font-size: 11px; color: var(--text-muted); margin-top: auto; }
  .ncard .npill { font-size: 10px; font-weight: 700; padding: 2px 7px; border-radius: 999px; }
  .npill.on { background: color-mix(in srgb, var(--good) 18%, transparent); color: var(--good); }
  .npill.off { background: var(--surface-2); color: var(--text-muted); }
  .ncard .nprice { font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums; margin-top: 2px; }

  /* ---------- DASHBOARD ---------- */
  .banner { background: color-mix(in srgb, var(--series-5) 12%, transparent);
    border: 1px solid color-mix(in srgb, var(--series-5) 38%, transparent);
    color: var(--text-secondary); border-radius: 10px; padding: 11px 15px; font-size: 12.5px; margin-bottom: 20px; }
  .banner b { color: var(--text-primary); }
  .banner code { background: var(--surface-2); padding: 1px 5px; border-radius: 4px; font-size: 12px; }

  .hero { background: var(--surface-1); border: 1px solid var(--border); border-radius: 16px;
    padding: 20px 24px; box-shadow: var(--shadow); margin-bottom: 20px;
    display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 22px; align-items: center; }
  .ticker-row { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .ticker { font-size: 14px; font-weight: 700; letter-spacing: .5px; color: var(--text-secondary); }
  .ticker-name { font-size: 13px; color: var(--text-muted); }
  .price { font-size: 40px; font-weight: 800; letter-spacing: -1.5px; margin: 6px 0 4px; font-variant-numeric: tabular-nums; }
  .chg { display: inline-flex; align-items: center; gap: 8px; font-weight: 700; font-size: 14px; flex-wrap: wrap; }
  .chg .pill { padding: 3px 9px; border-radius: 8px; font-size: 13px; }
  .up { color: var(--good); } .up .pill { background: color-mix(in srgb, var(--good) 15%, transparent); }
  .down { color: var(--critical); } .down .pill { background: color-mix(in srgb, var(--critical) 15%, transparent); }
  .capbox { text-align: right; }
  .capbox .k { font-size: 12px; color: var(--text-muted); text-transform: uppercase; letter-spacing: .4px; }
  .capbox .v { font-size: 25px; font-weight: 800; letter-spacing: -.5px; font-variant-numeric: tabular-nums; }
  @media (max-width: 560px) { .capbox { text-align: left; } }

  .tiles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 22px; }
  @media (max-width: 720px) { .tiles { grid-template-columns: repeat(2, 1fr); } }
  .tile { background: var(--surface-1); border: 1px solid var(--border); border-radius: 14px; padding: 14px 16px; box-shadow: var(--shadow); }
  .tile .k { font-size: 12px; color: var(--text-muted); text-transform: uppercase; letter-spacing: .4px; }
  .tile .v { font-size: 22px; font-weight: 700; margin-top: 5px; letter-spacing: -.5px; font-variant-numeric: tabular-nums; }
  .tile .sub { font-size: 12px; color: var(--text-secondary); margin-top: 2px; }

  /* "If you believe" valuation playground */
  .believe { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 8px; }
  @media (max-width: 760px) { .believe { grid-template-columns: 1fr; } }
  .believe-in, .believe-out { background: var(--surface-1); border: 1px solid var(--border); border-radius: 16px; padding: 20px 22px; box-shadow: var(--shadow); }
  .slider { margin-bottom: 20px; }
  .slabel { display: flex; justify-content: space-between; align-items: baseline; font-size: 13.5px; margin-bottom: 9px; }
  .slabel span { color: var(--text-secondary); font-weight: 600; }
  .slabel b { color: var(--accent); font-variant-numeric: tabular-nums; font-size: 16px; }
  .slider input[type=range] { width: 100%; accent-color: var(--accent); cursor: pointer; }
  .bnote { font-size: 11.5px; color: var(--text-muted); line-height: 1.55; margin-top: 2px; }
  .believe-out { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; align-content: start; }
  .bout .k { font-size: 12px; color: var(--text-muted); text-transform: uppercase; letter-spacing: .4px; }
  .bout .v { font-size: 24px; font-weight: 800; letter-spacing: -.5px; margin-top: 5px; font-variant-numeric: tabular-nums; }
  .bout.main { grid-column: 1 / -1; }
  .bout.main .v { font-size: 38px; }
  .bout .sub { font-size: 12px; color: var(--text-secondary); margin-top: 3px; }

  .charts { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; }
  @media (max-width: 820px) { .charts { grid-template-columns: 1fr; } }
  .card { background: var(--surface-1); border: 1px solid var(--border); border-radius: 16px; padding: 16px 18px 14px; box-shadow: var(--shadow); }
  .card-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
  .card-head h3 { font-size: 15px; margin: 0; }
  .card-head .meta { font-size: 12px; color: var(--text-muted); }
  .src { font-size: 11px; color: var(--text-muted); margin: 3px 0 8px; }
  .src code { background: var(--surface-2); padding: 1px 5px; border-radius: 4px; }

  svg { display: block; width: 100%; height: auto; overflow: visible; }
  .axis text { fill: var(--text-muted); font-size: 11px; }
  .gridline { stroke: var(--grid); stroke-width: 1; }
  .zero { stroke: var(--text-muted); stroke-width: 1; opacity: .5; }
  .legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 12.5px; color: var(--text-secondary); margin-top: 8px; }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .swatch { width: 11px; height: 11px; border-radius: 3px; flex: none; }

  .tt { position: fixed; pointer-events: none; z-index: 30; opacity: 0; transition: opacity .08s;
    background: var(--surface-1); border: 1px solid var(--border); border-radius: 10px; box-shadow: var(--shadow);
    padding: 8px 11px; font-size: 12.5px; color: var(--text-primary); min-width: 130px; }
  .tt .tt-h { color: var(--text-muted); font-size: 11.5px; margin-bottom: 3px; }
  .tt .tt-row { display: flex; justify-content: space-between; gap: 16px; }
  .tt b { font-variant-numeric: tabular-nums; }

  footer { margin-top: 28px; font-size: 12px; color: var(--text-muted); text-align: center; line-height: 1.7; }
  footer code { background: var(--surface-2); padding: 1px 5px; border-radius: 4px; }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand" onclick="location.hash='#/'">
      <div class="brand-mark">◆</div>
      <div>
        <h1>Nifty 50 Visuals</h1>
        <p>Financial statements, visualized</p>
      </div>
    </div>
    <div class="nav">
      <span class="navlink" data-scroll="companies">Companies</span>
      <span class="navlink" data-scroll="sectors">Sectors</span>
      <span class="navlink" data-scroll="why">Why us</span>
      <button class="toggle" id="themeBtn" type="button">◐ Theme</button>
    </div>
  </header>
  <div id="app"></div>
  <footer>
    Nifty 50 company dashboards.<br/>
    Constituent list is indicative and may lag index reconstitutions. For information only — not investment advice.
  </footer>
</div>

<div class="tt" id="tt"></div>

<script>
/* ================================================================== *
 *  STOCKS — company financial data.                                   *
 * ================================================================== */
const FY = ['FY17','FY18','FY19','FY20','FY21','FY22','FY23','FY24','FY25','FY26'];
const QLAB = ['Q3 FY24','Q4 FY24','Q1 FY25','Q2 FY25','Q3 FY25','Q4 FY25','Q1 FY26','Q2 FY26','Q3 FY26','Q4 FY26'];

const STOCKS = {
  TITAN: {

      price:     [462.75,942.30,1141.85,933.70,1558.05,2536.15,2514.90,3801.80,3063.35,3951.40],
      dividend:  [230.83,332.92,443.90,356,356,667.5,890,979,979,1335],

      cff:       [-165.60,-252.45,-488.83,-242,-1234,-403,457,-1329,-7,-2159],
      reserves:  [4143.60,5001.10,5981.37,6580,7408,9214,11762,9304,11535,15614],
      capital:   [88.78,88.78,88.78,89,89,89,89,89,89,89],
      borrowings:[1882.43,1691.01,2392.98,3562,5638,7275,9367,15528,20777,30621],
    },
    quarter: { sales:[14164,12494,13266,14534,17740,14916,16523,18725,25416,26920],
               netProfit:[1053,771,715,704,1047,871,1091,1120,1684,1179] },
    extra: { label: 'Inventory', src: 'Balance Sheet → Inventory', color: 'var(--series-6)',
             vals: [4925.74,5924.84,7038.82,8103,8408,13609,16584,19051,28184,42743] },
  },

/* ---------- helpers ---------- */
const inr = n => '₹' + n.toLocaleString('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const cr  = n => '₹' + Math.round(n).toLocaleString('en-IN') + ' Cr';
const lcr = n => '₹' + (n / 100000).toFixed(2) + 'L Cr';
const kfmt = v => { const a = Math.abs(v); return a >= 1000 ? (v / 1000).toFixed(a >= 10000 ? 0 : 1) + 'k' : v.toFixed(0); };
const lfmt = v => Math.abs(v) >= 1000 ? (v / 1000).toFixed(1) + 'k' : Math.round(v).toString();
const tt  = document.getElementById('tt');
function showTip(html, x, y) {
  tt.innerHTML = html; tt.style.opacity = 1;
  const r = tt.getBoundingClientRect();
  let left = x + 14, top = y - r.height - 10;
  if (left + r.width > innerWidth - 8) left = x - r.width - 14;
  if (top < 8) top = y + 16;
  tt.style.left = left + 'px'; tt.style.top = top + 'px';
}
const hideTip = () => tt.style.opacity = 0;

function kpis(st) {
  const a = st.annual, price = st.meta.currentPrice;
  const shares = st.meta.marketCap / price;
  const npLast = a.netProfit.at(-1), npPrev = a.netProfit.at(-2);
  const eps = npLast / shares, pe = price / eps;
  const equity = a.capital.at(-1) + a.reserves.at(-1);
  const roe = npLast / equity * 100, book = equity / shares;
  const divYield = (a.dividend.at(-1) / shares) / price * 100;
  const fyEnd = a.price.at(-1), chgPct = (price - fyEnd) / fyEnd * 100;
  const cagr = arr => (Math.pow(arr.at(-1) / arr[0], 1 / (arr.length - 1)) - 1) * 100;
  return { shares, npLast, npPrev, eps, pe, roe, book, divYield, fyEnd, chgPct,
           payout: a.dividend.at(-1) / npLast * 100, yoy: (npLast / npPrev - 1) * 100,
           revCAGR: cagr(a.sales), profitCAGR: cagr(a.netProfit) };
}

function barChart(svgId, labels, values, opts) {
  const svg = document.getElementById(svgId);
  const { color, unit = '₹ Cr', fmt = v => v.toLocaleString('en-IN') } = opts;
  const n = values.length, W = 560, H = 260, pad = { l: 46, r: 12, t: 16, b: 40 };
  const max = Math.max(...values) * 1.12, bw = (W - pad.l - pad.r) / n;
  const y = v => pad.t + (1 - v / max) * (H - pad.t - pad.b);
  let grid = '';
  for (let i = 0; i <= 4; i++) { const val = i / 4 * max, yy = y(val);
    grid += `<line class="gridline" x1="${pad.l}" y1="${yy.toFixed(1)}" x2="${W - pad.r}" y2="${yy.toFixed(1)}"/>`;
    grid += `<text x="${pad.l - 8}" y="${(yy + 4).toFixed(1)}" text-anchor="end" fill="var(--text-muted)" font-size="11">${kfmt(val)}</text>`; }
  let bars = '', xlab = '';
  values.forEach((v, i) => {
    const x = pad.l + i * bw + bw * 0.16, w = bw * 0.68, h = (H - pad.t - pad.b) * (v / max), cx = pad.l + i * bw + bw / 2;
    bars += `<rect x="${x.toFixed(1)}" y="${y(v).toFixed(1)}" width="${w.toFixed(1)}" height="${h.toFixed(1)}" rx="3" fill="${color}" opacity="0.92" data-i="${i}"/>`;
    bars += `<text x="${cx.toFixed(1)}" y="${(y(v) - 6).toFixed(1)}" text-anchor="middle" fill="var(--text-secondary)" font-size="9" font-weight="700">${v.toLocaleString('en-IN')}</text>`;
    const parts = String(labels[i]).split(' ');
    xlab += `<text x="${(pad.l + i * bw + bw / 2).toFixed(1)}" y="${H - 22}" text-anchor="middle" fill="var(--text-muted)" font-size="10.5">${parts[0]}</text>`;
    if (parts[1]) xlab += `<text x="${(pad.l + i * bw + bw / 2).toFixed(1)}" y="${H - 9}" text-anchor="middle" fill="var(--text-muted)" font-size="9.5">${parts[1]}</text>`;
  });
  svg.innerHTML = `<g class="axis">${grid}${xlab}</g>${bars}`;
  svg.querySelectorAll('rect[data-i]').forEach(r => {
    r.addEventListener('mousemove', e => { const i = +r.dataset.i; r.setAttribute('opacity', '1');
      showTip(`<div class="tt-h">${labels[i]}</div><div class="tt-row"><span>${unit}</span><b>${fmt(values[i])}</b></div>`, e.clientX, e.clientY); });
    r.addEventListener('mouseleave', () => { hideTip(); r.setAttribute('opacity', '0.92'); });
  });
}

function miniBars(vals, w, h, col) {

  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:${h}px;margin-top:6px">` +

function miniGauge(pct, cap, col) {
  const R = 50, cx = 62, cy = 60;
  const P = deg => [cx + R * Math.cos(deg * Math.PI / 180), cy - R * Math.sin(deg * Math.PI / 180)];
  const arc = (a, b) => { const [x1, y1] = P(a), [x2, y2] = P(b); return `M ${x1.toFixed(1)} ${y1.toFixed(1)} A ${R} ${R} 0 0 1 ${x2.toFixed(1)} ${y2.toFixed(1)}`; };
  const tv = 180 * (1 - Math.min(pct, cap) / cap);
  return `<svg viewBox="0 0 124 72" style="width:100%;max-width:150px;margin:4px auto 0;display:block">
    <path d="${arc(180, 0)}" fill="none" stroke="var(--surface-2)" stroke-width="11" stroke-linecap="round"/>
    <path d="${arc(180, tv)}" fill="none" stroke="${col}" stroke-width="11" stroke-linecap="round"/>
    <text x="62" y="57" text-anchor="middle" font-size="21" font-weight="800" fill="var(--text-primary)">${pct.toFixed(0)}%</text></svg>`;
}

function renderHome() {
  const loaded = NIFTY50.filter(([s]) => STOCKS[s]);
  const t = STOCKS.TITAN, tk = kpis(t);

  const featCards = loaded.map(([s]) => {
    const st = STOCKS[s], k = kpis(st), up = k.chgPct >= 0;
    return `<div class="fco" onclick="location.hash='#/stock/${s}'">
      <div class="logo" style="background:linear-gradient(135deg,${st.accent},var(--accent2))">${s[0]}</div>
      <div class="fco-name">${st.name}</div>
      <div class="fco-price">${inr(st.meta.currentPrice)}</div>
      <div class="fco-chg ${up ? 'chg-up' : 'chg-down'}">${up ? '▲ +' : '▼ '}${k.chgPct.toFixed(1)}%</div>
      <div class="fco-stats">
        <div class="r"><span>M.Cap</span><b>${lcr(st.meta.marketCap)}</b></div>
        <div class="r"><span>ROE</span><b>${k.roe.toFixed(0)}%</b></div>
        <div class="r"><span>Revenue CAGR</span><b>${k.revCAGR.toFixed(1)}%</b></div>
        <div class="r"><span>Profit CAGR</span><b>${k.profitCAGR.toFixed(1)}%</b></div>
      </div></div>`;
  }).join('');
  const soonCards = NIFTY50.filter(([s]) => !STOCKS[s]).slice(0, 4).map(([s, n]) =>
    `<div class="fco soon">
      <div class="logo" style="background:var(--surface-2);color:var(--text-muted)">${s[0]}</div>
      <div class="fco-name">${n}</div>
      <div class="fco-price" style="color:var(--text-muted)">—</div>
      <div class="fco-chg" style="color:var(--text-muted)">Dashboard soon</div></div>`).join('');

  const counts = {}; NIFTY50.forEach(([, , sec]) => counts[sec] = (counts[sec] || 0) + 1);
  const secIcon = {
    'Financial Services': ['🏦', 'var(--series-1)'], 'Information Technology': ['💻', 'var(--series-7)'],
    'Automobile': ['🚗', 'var(--series-6)'], 'Healthcare': ['🩺', 'var(--series-5)'],
    'FMCG': ['🧴', 'var(--series-4)'], 'Metals & Mining': ['⛏️', 'var(--series-8)'],
    'Consumer': ['🛍️', 'var(--series-3)'], 'Consumer Durables': ['💎', 'var(--series-3)'],
    'Energy': ['⚡', 'var(--series-4)'], 'Cement': ['🏗️', 'var(--series-2)'],
    'Power': ['🔌', 'var(--series-4)'], 'Telecom': ['📡', 'var(--series-1)'],
    'Construction': ['🏗️', 'var(--series-2)'], 'Capital Goods': ['⚙️', 'var(--series-5)'],
    'Infrastructure': ['🛳️', 'var(--series-1)'],
  };
  const topSecs = Object.keys(counts).sort((a, b) => counts[b] - counts[a]).slice(0, 6);
  const sectorTiles = topSecs.map(sec => { const [ic, col] = secIcon[sec] || ['📊', 'var(--accent)'];
    return `<div class="sector" data-sec="${sec}" style="background:linear-gradient(155deg, color-mix(in srgb,${col} 15%, var(--surface-1)), var(--surface-1))">
      <div class="sicon" style="background:color-mix(in srgb,${col} 22%, transparent);color:${col}">${ic}</div>
      <div><div class="sname">${sec}</div><div class="scount">${counts[sec]} companies</div></div></div>`;
  }).join('');

  const sectors = ['All', ...Array.from(new Set(NIFTY50.map(r => r[2]))).sort()];
  const secChips = sectors.map((s, i) => `<button class="secbtn" data-sec="${s}" aria-pressed="${i === 0}">${s}</button>`).join('');
  const cross = x => `<div class="li"><span class="ic" style="background:var(--critical)">✕</span>${x}</div>`;
  const check = x => `<div class="li"><span class="ic" style="background:var(--good)">✓</span>${x}</div>`;

  app.innerHTML = `
    <section class="hero-land">
      <div>
        <span class="eyebrow">✦ Modern investing for modern minds</span>
        <h1>Financial statements,<br/><span class="grad">beautifully visualized.</span></h1>
        <p class="hero-sub">Stop reading spreadsheets. Understand businesses through interactive visual stories — a decade of financials at a glance.</p>
        <div class="hero-cta">
          <button class="btn btn-primary" data-scroll="companies">Explore companies</button>
          <button class="btn btn-ghost" onclick="location.hash='#/stock/TITAN'">See Titan →</button>
        </div>
      </div>
      <div class="hero-visual">
        <div class="fcard fc-rev">
          <div class="fc-t">Revenue growth · Titan</div>
          <div style="font-size:17px;font-weight:800;color:var(--good);margin-top:2px">+${tk.revCAGR.toFixed(1)}% <span style="color:var(--text-muted);font-weight:600;font-size:11px">10Y CAGR</span></div>
          ${miniSpark(t.annual.sales, 224, 58, 'var(--accent)')}
        </div>
        <div class="fcard fc-roce">
          <div class="fc-t">Return on equity</div>
          ${miniGauge(tk.roe, 60, 'var(--series-5)')}
        </div>
        <div class="fcard fc-np">
          <div class="fc-t">Net profit · Titan</div>
          <div class="fc-v">${cr(tk.npLast)}</div>
          <div style="font-size:12px;font-weight:700;color:var(--good)">+${tk.profitCAGR.toFixed(1)}% <span style="color:var(--text-muted);font-weight:600;font-size:11px">10Y CAGR</span></div>
          ${miniBars(t.annual.netProfit, 164, 38, 'var(--series-7)')}
        </div>
      </div>
    </section>

    <div class="row-head"><h2>Featured companies</h2><a data-scroll="companies">View all →</a></div>
    <div class="feat-scroll">${featCards}${soonCards}</div>

    <div class="row-head" id="sectors"><h2>Trending sectors</h2><a data-scroll="companies">View all →</a></div>
    <div class="sector-grid">${sectorTiles}</div>

    <div class="row-head" id="why"><h2>Why visual dashboards?</h2></div>
    <div class="compare">
      <div class="comp"><h4>Plain spreadsheets</h4>${cross('Dense tables')}${cross('Confusing')}${cross('Static')}${cross('Hard to scan')}</div>
      <div class="comp good"><h4>Nifty 50 Visuals</h4>${check('Interactive charts')}${check('Colour-coded')}${check('Values on every mark')}${check('Instantly readable')}</div>
    </div>

    <div class="row-head" id="companies"><h2>All Nifty 50 companies</h2><span style="font-size:13px;color:var(--text-muted)">${loaded.length} loaded · ${NIFTY50.length} total</span></div>
    <div class="controls">
      <input class="search" id="search" type="search" placeholder="Search company or ticker…" autocomplete="off" />
      <div class="secfilter" id="secfilter">${secChips}</div>
    </div>
    <div class="nifty-grid" id="niftyGrid"></div>`;

  const grid = document.getElementById('niftyGrid');
  let curSec = 'All', curQ = '';
  function draw() {
    const rows = NIFTY50.filter(([s, n, sec]) =>
      (curSec === 'All' || sec === curSec) &&
      (s.toLowerCase().includes(curQ) || n.toLowerCase().includes(curQ)));
    grid.innerHTML = rows.map(([s, n, sec]) => {
      const st = STOCKS[s];
      if (st) { const k = kpis(st), up = k.chgPct >= 0;
        return `<a class="ncard loaded" href="#/stock/${s}">
          <div class="nsym">${s}<span class="npill on">Loaded</span></div>
          <div class="nname">${n}</div>
          <div class="nprice">${inr(st.meta.currentPrice)} <span class="${up ? 'chg-up' : 'chg-down'}" style="font-size:12px">${up ? '+' : ''}${k.chgPct.toFixed(1)}%</span></div>
          <div class="nsec">${sec}</div></a>`;
      }
      return `<div class="ncard muted">
        <div class="nsym">${s}<span class="npill off">No data</span></div>
        <div class="nname">${n}</div>
        <div class="nsec">${sec}</div></div>`;
    }).join('') || `<div style="color:var(--text-muted);padding:20px">No companies match.</div>`;
  }
  draw();
  function setSec(sec) { curSec = sec; document.querySelectorAll('.secbtn').forEach(x => x.setAttribute('aria-pressed', x.dataset.sec === sec)); draw(); }
  document.getElementById('search').addEventListener('input', e => { curQ = e.target.value.trim().toLowerCase(); draw(); });
  document.getElementById('secfilter').addEventListener('click', e => { const b = e.target.closest('.secbtn'); if (b) setSec(b.dataset.sec); });
  app.querySelectorAll('.sector').forEach(el => el.addEventListener('click', () => {
    setSec(el.dataset.sec); document.getElementById('companies').scrollIntoView({ behavior: 'smooth' });
  }));
  app.querySelectorAll('[data-scroll]').forEach(el => el.addEventListener('click', () => {
    const target = document.getElementById(el.dataset.scroll); if (target) target.scrollIntoView({ behavior: 'smooth' });
  }));
}

function chartCard(id, title, meta, tall) {
  return `<div class="card"${tall ? ' style="grid-column:1/-1"' : ''}>
    <div class="card-head"><h3>${title}</h3><span class="meta">${meta}</span></div>
    <svg id="${id}" viewBox="0 0 ${tall ? 1140 : 560} ${tall ? 300 : 260}" role="img" aria-label="${title}"></svg>
  </div>`;
}

function renderStock(sym) {
  const st = STOCKS[sym], a = st.annual, k = kpis(st), up = k.chgPct >= 0;
  const dg = Math.max(0, Math.min(40, Math.round(k.profitCAGR)));
  const dpe = Math.max(10, Math.min(100, Math.round(k.pe)));
  const dyr = 5;
  const tiles = [
    { k: 'P/E Ratio', v: k.pe.toFixed(1), sub: 'EPS ' + inr(k.eps) },
    { k: 'ROE', v: k.roe.toFixed(1) + '%', sub: 'Book ' + inr(k.book) },
    { k: 'Div. Yield', v: k.divYield.toFixed(2) + '%', sub: 'Payout ' + Math.round(k.payout) + '%' },
    { k: 'Net Profit', v: cr(k.npLast), sub: 'FY26 · ' + (k.yoy >= 0 ? '+' : '') + Math.round(k.yoy) + '% YoY' },
  ];
  app.innerHTML = `
    <div class="backlink" onclick="location.hash='#/'">← All Nifty 50</div>
    <div class="banner"><b>Snapshot for ${st.name}.</b> Point-in-time figures, not a live feed —
      10 years of P&amp;L, 10 quarters, balance sheet &amp; cash flow. Amounts in ₹ crore unless noted; <b>FY</b> = year ended 31&nbsp;March.
      ${st.note ? '<br/><span style="color:var(--text-muted)">Note: ' + st.note + '</span>' : ''}</div>
    <section class="hero">
      <div>
        <div class="ticker-row"><span class="ticker">${st.sym}</span><span class="ticker-name">${st.sub}</span></div>
        <div class="price">${inr(st.meta.currentPrice)}</div>
        <div class="chg ${up ? 'up' : 'down'}"><span class="pill">${up ? '▲ +' : '▼ '}${k.chgPct.toFixed(1)}%</span>
          <span style="color:var(--text-muted);font-weight:500">vs FY26 close ${inr(k.fyEnd)}</span></div>
      </div>
      <div class="capbox"><div class="k">Market Capitalisation</div><div class="v">${lcr(st.meta.marketCap)}</div>
        <div class="k" style="margin-top:8px">${k.shares.toFixed(2)} cr shares · FV ₹${st.meta.faceValue}</div></div>
    </section>
    <section class="tiles">${tiles.map(t => `<div class="tile"><div class="k">${t.k}</div><div class="v">${t.v}</div><div class="sub">${t.sub}</div></div>`).join('')}</section>
    <div class="section-title">Each dataset — charted separately</div>
    <div class="charts">
      ${chartCard('c-qrev','Quarterly sales','₹ Cr · 10 qtrs')}
      ${chartCard('c-qnp','Quarterly net profit','₹ Cr · 10 qtrs')}
      ${chartCard('c-asales','Annual sales','₹ Cr · FY17–FY26')}
      ${chartCard('c-anp','Annual net profit','₹ Cr · FY17–FY26')}
      ${chartCard('c-price','Share price — year-end','₹ · FY17 → now')}
      ${chartCard('c-cfo','Cash from operating activity','₹ Cr · FY17–FY26')}
    </div>
    <div class="section-title" style="margin-top:26px">Balance sheet &amp; cash flow</div>
    <div class="charts">
      <div class="card"><div class="card-head"><h3>Net worth vs. borrowings</h3><span class="meta">₹ Cr · FY17–FY26</span></div>
        <svg id="c-nwb" viewBox="0 0 560 260" role="img" aria-label="Net worth vs borrowings"></svg>
        <div class="legend"><span><i class="swatch" style="background:var(--series-5)"></i> Net worth</span><span><i class="swatch" style="background:var(--series-8)"></i> Borrowings</span></div></div>
      <div class="card"><div class="card-head"><h3>${st.extra.label}</h3><span class="meta">₹ Cr · FY17–FY26</span></div>
        <svg id="c-extra" viewBox="0 0 560 260" role="img" aria-label="${st.extra.label}"></svg></div>
      <div class="card" style="grid-column:1/-1"><div class="card-head"><h3>Cash flow — operating · investing · financing</h3><span class="meta">₹ Cr · FY17–FY26</span></div>
        <svg id="c-cf3" viewBox="0 0 1140 300" role="img" aria-label="Cash flow by activity"></svg>
        <div class="legend"><span><i class="swatch" style="background:var(--series-1)"></i> Operating</span><span><i class="swatch" style="background:var(--series-4)"></i> Investing</span><span><i class="swatch" style="background:var(--series-7)"></i> Financing</span></div></div>
    </div>

    <div class="section-title" style="margin-top:30px">If you believe…</div>
    <div class="believe">
      <div class="believe-in">
        <div class="slider"><div class="slabel"><span>EPS CAGR</span><b id="v-g">${dg}%</b></div>
          <input type="range" id="s-g" min="0" max="40" step="1" value="${dg}" aria-label="EPS CAGR"></div>
        <div class="slider"><div class="slabel"><span>Exit P/E</span><b id="v-pe">${dpe}</b></div>
          <input type="range" id="s-pe" min="10" max="100" step="1" value="${dpe}" aria-label="Exit P E"></div>
        <div class="slider"><div class="slabel"><span>No. of years</span><b id="v-n">${dyr} yrs</b></div>
          <input type="range" id="s-n" min="1" max="15" step="1" value="${dyr}" aria-label="Number of years"></div>
        <div class="bnote">EPS compounds at the chosen CAGR over your holding period; the exit price = EPS × exit P/E, and intrinsic value discounts that back at 11% a year. Illustrative scenario — not a forecast or recommendation.</div>
      </div>
      <div class="believe-out">
        <div class="bout main"><div class="k">Intrinsic value <span style="text-transform:none;color:var(--text-muted);letter-spacing:0">· today</span></div>
          <div class="v" id="o-iv">₹—</div><div class="sub">vs current price ${inr(st.meta.currentPrice)}</div></div>
        <div class="bout"><div class="k">Upside</div><div class="v" id="o-up">—</div></div>
        <div class="bout"><div class="k">Expected CAGR</div><div class="v" id="o-cagr">—</div></div>
        <div class="bout" style="grid-column:1/-1"><div class="k">Exit price · year <span id="o-ny">${dyr}</span></div><div class="v" id="o-pp" style="font-size:20px">—</div></div>
      </div>
    </div>`;

  barChart('c-qrev', QLAB, st.quarter.sales, { color: 'var(--series-1)' });
  barChart('c-qnp', QLAB, st.quarter.netProfit, { color: 'var(--series-4)' });
  barChart('c-asales', FY, a.sales, { color: 'var(--series-1)' });
  barChart('c-anp', FY, a.netProfit, { color: 'var(--series-5)' });
  areaChart('c-price', [...FY, 'Now'], [...a.price, st.meta.currentPrice], { color: 'var(--series-7)', markLast: true });
  signedBarChart('c-cfo', FY, a.cfo, { pos: 'var(--good)', neg: 'var(--critical)' });
  groupedBarChart('c-nwb', FY, [
    { name: 'Net worth', vals: a.netWorth, color: 'var(--series-5)' },
    { name: 'Borrowings', vals: a.borrowings, color: 'var(--series-8)' }]);
  barChart('c-extra', FY, st.extra.vals, { color: st.extra.color });
  groupedSignedBar('c-cf3', FY, [
    { name: 'Operating', vals: a.cfo, color: 'var(--series-1)' },
    { name: 'Investing', vals: a.cfi, color: 'var(--series-4)' },
    { name: 'Financing', vals: a.cff, color: 'var(--series-7)' }]);

  // "If you believe…" — live reverse valuation
  (function believe() {
    const price = st.meta.currentPrice, eps0 = k.eps, disc = 0.11;
    const el = id => document.getElementById(id);
    function calc() {
      const g = +el('s-g').value / 100, pe = +el('s-pe').value, N = +el('s-n').value;
      el('v-g').textContent = el('s-g').value + '%';
      el('v-pe').textContent = el('s-pe').value;
      el('v-n').textContent = el('s-n').value + (N === 1 ? ' yr' : ' yrs');
      el('o-ny').textContent = N;
      const epsN = eps0 * Math.pow(1 + g, N);                // EPS grows at the chosen CAGR
      const priceN = epsN * pe;                              // exit price = EPS(year N) × exit P/E
      const intrinsic = priceN / Math.pow(1 + disc, N);      // discounted to today
      const upside = (intrinsic - price) / price * 100;
      const cagr = (Math.pow(priceN / price, 1 / N) - 1) * 100;
      el('o-iv').textContent = '₹' + Math.round(intrinsic).toLocaleString('en-IN');
      el('o-pp').textContent = '₹' + Math.round(priceN).toLocaleString('en-IN');
      const upEl = el('o-up'); upEl.textContent = (upside >= 0 ? '+' : '') + upside.toFixed(0) + '%'; upEl.className = 'v ' + (upside >= 0 ? 'up' : 'down');
      const cEl = el('o-cagr'); cEl.textContent = (cagr >= 0 ? '+' : '') + cagr.toFixed(0) + '%'; cEl.className = 'v ' + (cagr >= 0 ? 'up' : 'down');
    }
    ['s-g', 's-pe', 's-n'].forEach(id => el(id).addEventListener('input', calc));
    calc();
  })();

  scrollTo(0, 0);
}

/* ---------- router ---------- */
function route() {
  hideTip();
  const h = location.hash.replace(/^#\/?/, '');
  const m = h.match(/^stock\/(.+)$/);
  if (m && STOCKS[m[1]]) renderStock(m[1]);
  else renderHome();
}
window.addEventListener('hashchange', route);
route();

/* ---------- theme ---------- */
document.getElementById('themeBtn').addEventListener('click', () => {
  const cur = document.documentElement.getAttribute('data-theme');
  const next = cur === 'dark' ? 'light' : cur === 'light' ? 'dark'
    : (matchMedia('(prefers-color-scheme: dark)').matches ? 'light' : 'dark');
  document.documentElement.setAttribute('data-theme', next);
  route(); // re-render so SVG picks up themed colors
});

/* header nav → scroll to a home section (routing home first if needed) */
document.querySelectorAll('header .navlink').forEach(el => el.addEventListener('click', () => {
  const id = el.dataset.scroll;
  const go = () => { const target = document.getElementById(id); if (target) target.scrollIntoView({ behavior: 'smooth' }); };
  if (location.hash && location.hash !== '#/' && location.hash !== '') { location.hash = '#/'; setTimeout(go, 70); }
  else go();
}));
</script>
</body>
</html>
